  <g>
    <rect x="24" y="602" width="372" height="46" rx="11" fill="#f8f7fc" stroke="#edebf6"/>
    <circle cx="52" cy="625" r="13" fill="#7b30fc" fill-opacity=".12"/><use href="#tick2" transform="translate(52 625)"/>
