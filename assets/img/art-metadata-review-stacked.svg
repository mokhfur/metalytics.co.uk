<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 680" width="420" height="680" role="img" aria-label="The metadata review: business objectives, the metadata you hold, processes and workflows, then a plan to improve. It powers efficiency, quality, informed decisions and operational excellence.">
  <defs>
    <style>
      .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
      .lbl{font-size:20px;font-weight:700;fill:#1b1033}
      .num{font-size:14px;font-weight:700;fill:#fff}
      .cap{font-size:16px;font-weight:500;fill:#64647a}
      .out{font-size:17px;font-weight:600;fill:#1b1033}
      .ico{fill:none;stroke:#7b30fc;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <g id="tick2"><path d="m-4.6 .2 3.2 3.2 6-6.4" fill="none" stroke="#7b30fc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>

  <rect x=".75" y=".75" width="418.5" height="678.5" rx="18" fill="#fff" stroke="#e9e7f2" stroke-width="1.5"/>

  <g>
